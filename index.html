<script>
/* 强制默认进入太阳系开屏：内联脚本每次执行，不走缓存 */
(function () {
  try {
    var u = new URL(location.href);

})();

<script>
/* 版本感知缓存清理：记录上次版本号，版本变化才清空 SW 缓存并注销旧 SW，
   确保任何设备加载到的都是最新文件；版本不变则保留离线缓存 */
(function () {
  try {
    var VER = '27';
    var last = null;
    try { last = localStorage.getItem('guage.ver'); } catch (e) {}
    /* 默认 AI 后端：GitHub Pages 是纯静态，默认指向 Vercel 公网后端；
       URL ?api=xxx 可手动覆盖（含 localStorage 'guage.api'） */
    try {
      if (!localStorage.getItem('guage.api')) {
        localStorage.setItem('guage.api', 'https://vercel-app-ten-khaki.vercel.app');
      }
    } catch (e) {}
    if (last !== VER) {
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      try { localStorage.setItem('guage.ver', VER); } catch (e) {}
    }
  } catch (e) {}
})();
</script>
